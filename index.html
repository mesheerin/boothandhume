<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Booth &amp; Hume</title>
<meta name="description" content="Booth &amp; Hume. Independent challenge for major decisions.">
<link rel="canonical" href="https://boothandhume.com/">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  @font-face{font-family:'Libre Caslon Display';src:url('fonts/LibreCaslonDisplay.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap;}
  @font-face{font-family:'Inter Tight';src:url('fonts/InterTight.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:swap;}
  :root{--ink:#1B2A41;--ground:#FAF6EE;--muted:#4A4845;--accent:#C6402F;}
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--ground); color:var(--ink);
    font-family:'Inter Tight',system-ui,sans-serif;
    min-height:100svh; display:flex; flex-direction:column; justify-content:center;
    padding:8vh clamp(1.5rem,8vw,5rem);
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  .wm{font-family:'Libre Caslon Display',Georgia,serif; font-weight:400; font-size:clamp(2.2rem,7.6vw,3.4rem); line-height:1; margin:0;}
  .rule{width:3.5rem; height:3px; background:var(--accent); border:0; margin:1.5rem 0 1.4rem;}
  .tag{margin:0; font-size:clamp(1rem,2.6vw,1.15rem); color:var(--muted);}
  .contact{margin:2rem 0 0; font-size:.95rem;}
  main{width:100%; max-width:1100px; margin:0 auto 10vh;}
  .contact a{color:var(--ink); text-decoration:none; border-bottom:1px solid rgba(27,42,65,.35); padding-bottom:1px;}
  .contact a:hover,.contact a:focus-visible{border-bottom-color:var(--ink);}
  :focus-visible{outline:1px solid var(--accent); outline-offset:4px;}
</style>
</head>
<body>
  <main>
    <h1 class="wm">Booth &amp; Hume</h1>
    <hr class="rule">
    <p class="tag">Independent challenge for major decisions</p>
    <p class="contact"><a href="mailto:practice@boothandhume.com">practice@boothandhume.com</a></p>
  </main>
</body>
</html>
